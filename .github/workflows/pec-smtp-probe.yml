name: PEC Setup HTTP Validation
on:
  push:
    paths:
      - '.github/workflows/pec-smtp-probe.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate PEC setup response headers
        run: |
          set -euo pipefail
          url='https://arbjparbiehclquavfnc.supabase.co/functions/v1/pec-setup'
          headers=$(mktemp)
          body=$(mktemp)
          code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 30 "$url")
          echo "HTTP=$code"
          cat "$headers"
          echo '--- BODY ---'
          head -c 300 "$body"; echo
          grep -qi '^content-type: text/html' "$headers"
          test "$code" = '400'
